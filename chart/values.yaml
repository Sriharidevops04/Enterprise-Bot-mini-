replicaCount: 2

image:
  repository: eb-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

config:
  appName: demo-app
  version: "1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: demo.local

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

probePath: /healthz
